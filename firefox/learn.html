/* ---- full dictionary entries ---- */
.wcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:8px 0;overflow:hidden}
.wcard>summary{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.wcard>summary::-webkit-details-marker{display:none}

.btn-enrich{padding:8px 14px;border-radius:10px;border:1px solid #7c5cff;background:#7c5cff;color:#fff;cursor:pointer;font:inherit}

.gr-block{margin-top:12px}

.btn-grammar .gr-ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#4fc1d7);color:#fff;box-shadow:0 4px 10px rgba(124,92,255,.35)}
.btn-grammar .gr-chev{font-size:13px;opacity:.6;transition:transform .2s}
.btn-grammar[aria-expanded="true"] .gr-chev{transform:rotate(180deg)}
.gr-panel{margin-top:10px;padding:4px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(124,92,255,.05)}
.gr-panel[hidden]{display:none}
.gr-row{padding:9px 0;border-top:1px solid var(--border)}
.gr-row:first-child{border-top:0}

.gr-row div{font-size:13.5px;line-height:1.75;color:var(--ink)}

.gr-loading i:nth-child(2){animation-delay:.15s}
.gr-loading i:nth-child(3){animation-delay:.3s}
