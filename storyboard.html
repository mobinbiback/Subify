@font-face{font-family:"Lalezar";src:url("fonts/Lalezar-Regular.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#faf6f0;--surface:#fff;--surface2:#f3ede4;--border:#ede5da;--ink:#241f1a;--muted:#786d60;--coral:#c93f2b;--teal:#0d9488}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Lalezar",sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 18px 60px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}h1{margin:0;color:var(--coral);font-size:22px}.sub{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 12px;cursor:pointer;font:600 13px inherit}.primary{background:var(--coral);color:#fff;border-color:var(--coral)}.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.scene{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #5d40230f}.scene img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111;display:block}.body{padding:12px}.time{font:700 11px ui-monospace,monospace;color:var(--coral)}.orig{margin-top:7px;color:var(--muted)}.fa{margin-top:7px;font-size:16px;font-weight:700;color:var(--teal)}.empty{text-align:center;color:var(--muted);padding:60px}.small{font-size:11px;color:var(--muted)}
