<!doctype html><html lang="fa" dir="rtl"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subify • یادگیری لغت</title><style>
@font-face{font-family:"Lalezar";src:url("fonts/Lalezar-Regular.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
:root{--bg:#faf6f0;--surface:#fff;--surface2:#f3ede4;--border:#ede5da;--ink:#241f1a;--muted:#786d60;--coral:#c93f2b;--teal:#0d9488;--amber:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Lalezar",sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 20px 60px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{margin:0;color:var(--coral);font-size:22px}.sub{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer;font:600 13px inherit}button:hover{background:var(--surface2)}.primary{background:var(--coral);border-color:var(--coral);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 8px #5d40230f}.word{font-size:25px;font-weight:800}.meaning{font-size:18px;color:var(--teal);margin-top:5px}.meta{color:var(--muted);font-size:12px;margin-top:8px}.example{margin-top:10px;padding:9px 11px;background:var(--surface2);border-radius:9px}.grades{display:flex;gap:8px;margin-top:14px}.grades button{flex:1}.again{color:#b42318}.good{color:var(--teal)}.easy{color:var(--amber)}.empty{text-align:center;color:var(--muted);padding:50px 10px}.list{margin-top:18px}.row{display:grid;grid-template-columns:1fr 1fr 90px 100px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}.row:first-child{font-weight:700;background:var(--surface2)}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap"><header><div><h1>📚 یادگیری لغت</h1><div class="sub">Leitner • کارت‌ها محلی ذخیره می‌شوند</div></div><div id="count"></div></header><div class="toolbar"><button id="refresh" class="primary">به‌روزرسانی</button><button id="review">شروع مرور</button></div><section id="reviewBox" class="grid"></section><section class="list"><div class="row"><span>لغت</span><span>معنی</span><span>سطح</span><span>مرحله</span></div><div id="rows"></div></section></main><script src="learn.js"></script></body></html>
